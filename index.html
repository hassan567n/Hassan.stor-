<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mimic Party - التصميم الجديد</title>
  <style>
    :root {
      --primary: #ff2a6d;
      --secondary: #05d9e8;
      --dark-bg: #0f0e17;
      --card-bg: rgba(24, 22, 37, 0.85);
      --text-color: #fffffe;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--dark-bg);
      background-image: radial-gradient(circle at 50% 50%, #1a153b 0%, #0f0e17 100%);
      color: var(--text-color);
      text-align: center;
      padding: 10px;
      margin: 0;
      width: 100vw;
      height: 100vh;
      box-sizing: border-box;
      overflow-x: hidden;
      overflow-y: auto;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 20px;
      max-width: 700px;
      margin: 15px auto;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    h2 {
      margin: 5px 0 15px 0;
      color: var(--secondary);
      text-shadow: 0 0 10px rgba(5, 217, 232, 0.4);
      font-size: 1.8rem;
      letter-spacing: 1px;
    }

    .btn {
      background: linear-gradient(135deg, var(--primary), #d81b60);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      margin: 8px 0;
      width: 100%;
      font-size: 1.1rem;
      box-shadow: 0 4px 15px rgba(255, 42, 109, 0.4);
      transition: all 0.3s ease;
    }

    .btn:active {
      transform: scale(0.97);
    }

    input {
      padding: 12px 15px;
      width: 85%;
      border-radius: 10px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      background: rgba(15, 14, 23, 0.8);
      color: white;
      margin-bottom: 15px;
      text-align: center;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s;
    }

    input:focus {
      border-color: var(--secondary);
    }

    .hidden { display: none; }

    .box {
      background: rgba(15, 14, 23, 0.6);
      border: 2px dashed var(--secondary);
      padding: 15px;
      border-radius: 14px;
      margin-top: 15px;
    }

    video, audio {
      width: 100%;
      max-height: 120px;
      border-radius: 10px;
      margin-top: 10px;
    }

    #wheelResult {
      font-size: 1.2rem;
      color: #ffeb3b;
      font-weight: bold;
      margin-top: 8px;
      text-shadow: 0 0 8px rgba(255, 235, 59, 0.4);
    }

    .mic-status {
      background: rgba(46, 125, 50, 0.3);
      border: 1px solid #4caf50;
      padding: 8px;
      border-radius: 8px;
      margin-top: 8px;
      font-weight: bold;
      font-size: 0.9rem;
      color: #81c784;
    }

    /* شبكة اختيار الشخصيات بتصميم راقي */
    .avatars-grid {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 15px;
    }

    .avatar-option {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 1.5rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .avatar-option.selected {
      border-color: var(--primary);
      background: rgba(255, 42, 109, 0.2);
      transform: translateY(-4px);
      box-shadow: 0 5px 15px rgba(255, 42, 109, 0.4);
    }

    /* ساحة حركة الشخصيات الأفقية الفخمة */
    .arena {
      background: rgba(10, 9, 15, 0.9);
      border: 2px solid rgba(5, 217, 232, 0.3);
      border-radius: 16px;
      height: 100px;
      position: relative;
      margin: 12px 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      padding: 0 20px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
    }

    .mic-icon {
      position: absolute;
      right: 20px;
      font-size: 1.8rem;
      background: var(--primary);
      padding: 6px 10px;
      border-radius: 50%;
      box-shadow: 0 0 15px var(--primary);
    }

    .avatar-player {
      position: absolute;
      left: 15px;
      transition: left 2s cubic-bezier(0.4, 0, 0.2, 1);
      background: rgba(30, 27, 48, 0.9);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      border: 2px solid var(--secondary);
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
  </style>

  <!-- مكتبات Firebase و PeerJS -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body id="pageBody">

  <div class="card">
    <h2>🎮 MIMIC PARTY</h2>

    <!-- 1. شاشة تسجيل الدخول -->
    <div id="loginScreen">
      <h3 style="margin: 5px 0 15px 0; font-size: 1.1rem; color: #a7a9be;">اختر شخصيتك واكتب اسمك المميز للبدء</h3>
      <input type="text" id="playerNameInput" placeholder="اسمك المستعار...">
      
      <label style="display:block; text-align:right; font-size:0.9rem; margin-bottom:8px; color: var(--secondary);">اختر الأفاتار:</label>
      <div class="avatars-grid">
        <div class="avatar-option selected" onclick="selectAvatar('😎', this)">😎</div>
        <div class="avatar-option" onclick="selectAvatar('🦊', this)">🦊</div>
        <div class="avatar-option" onclick="selectAvatar('🤖', this)">🤖</div>
        <div class="avatar-option" onclick="selectAvatar('🐱', this)">🐱</div>
        <div class="avatar-option" onclick="selectAvatar('👑', this)">👑</div>
      </div>

      <button class="btn" onclick="loginAndRequestMic()">دخول وفتح المايك 🎙️✨</button>
    </div>

    <!-- 2. القائمة الرئيسية -->
    <div id="lobbyScreen" class="hidden">
      <h3 id="welcomeUser" style="margin: 10px 0; color: var(--secondary);">أهلاً بك</h3>
      <button class="btn" style="background: linear-gradient(135deg, #00b0ff, #00e676);" onclick="createRoom()">🏠 إنشاء روم جديدة (أدمن)</button>
      
      <div class="box">
        <h3 style="margin: 5px 0; font-size: 1rem; color: var(--text-color);">🔍 انضمام للعبة</h3>
        <input type="text" id="roomCodeInput" placeholder="أدخل كود الروم (4 أرقام)...">
        <button class="btn" style="background: linear-gradient(135deg, #7c4dff, #b388ff);" onclick="searchAndJoinRoom()">بحث وانضمام 🚪</button>
      </div>
    </div>

    <!-- 3. شاشة اللعب والساحة التفاعلية -->
    <div id="roomScreen" class="hidden">
      <h3 id="roomTitle" style="margin: 5px 0; color: var(--secondary);">روم رقم: ...</h3>
      <div class="mic-status">🎙️ المحادثة الصوتية متصلة وجاهزة للحديث</div>

      <div class="arena" id="arenaBox">
        <div class="mic-icon">🎤</div>
      </div>

      <p id="playersList" style="background: rgba(15, 14, 23, 0.6); padding: 8px; border-radius: 10px; font-size: 0.9rem; margin: 8px 0; border: 1px solid rgba(255,255,255,0.05);">اللاعبون: جاري التحميل...</p>
      
      <div id="adminPanel" class="box" style="display: none;">
        <h3 style="margin: 5px 0; font-size: 1rem; color: var(--primary);">👑 لوحة التحكم بالأدمن</h3>
        <input type="file" id="fileInput" accept="audio/*,video/*" style="margin-bottom: 8px; width: 90%;">
        <button class="btn" style="padding: 10px; background: linear-gradient(135deg, #ff9100, #ffea00); color: #000;" onclick="uploadAndSend()">🚀 ابدأ الجولة وحرك اللاعبين</button>
      </div>

      <h3 id="challengeText" style="font-size: 1rem; margin: 10px 0; color: #ffeb3b;">بانتظار بدء التحدي...</h3>
      <video id="videoPlayer" controls style="display:none;"></video>
      <audio id="audioPlayer" controls style="display:none;"></audio>

      <div class="box" style="border-color: var(--primary); margin-top: 10px;">
        <h3 style="margin: 5px 0; font-size: 1rem; color: var(--primary);">🎡 عجلة التخريب والبونس</h3>
        <button class="btn" style="background: linear-gradient(135deg, #ab47bc, #7b1fa2); padding: 8px;" onclick="spinWheel()">دوران العجلة 🎯</button>
        <div id="wheelResult">اضغط لاكتشاف مصيرك!</div>
      </div>
    </div>
  </div>

  <audio id="remoteAudio" autoplay style="display:none;"></audio>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDMVsgQ0PKtsLKtnSdQvCMcSvA000000",
      authDomain: "mimic-party-95b12.firebaseapp.com",
      databaseURL: "https://mimic-party-95b12-default-rtdb.firebaseio.com",
      projectId: "mimic-party-95b12",
      storageBucket: "mimic-party-95b12.appspot.com",
      messagingSenderId: "779715969188",
      appId: "1:779715969188:web:51a10385234be6bbbe631"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();
    const storage = firebase.storage();

    let currentUser = null;
    let currentRoomId = null;
    let isUserAdmin = false;
    let localStream = null;
    let peer = null;
    let selectedAvatarEmoji = '😎';

    function selectAvatar(emoji, element) {
      document.querySelectorAll('.avatar-option').forEach(el => el.classList.remove('selected'));
      element.classList.add('selected');
      selectedAvatarEmoji = emoji;
    }

    async function loginAndRequestMic() {
      const name = document.getElementById("playerNameInput").value.trim();
      if (!name) return alert("يرجى كتابة اسمك أولاً!");

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      } catch (err) {
        console.log("Mic warning:", err);
      }

      auth.signInAnonymously().catch(() => {}).finally(() => {
        const fakeUid = 'user_' + Math.random().toString(36).substring(2, 9);
        currentUser = { uid: auth.currentUser ? auth.currentUser.uid : fakeUid, name: name, avatar: selectedAvatarEmoji };
        
        try {
          peer = new Peer(currentUser.uid);
          peer.on('call', (call) => {
            call.answer(localStream);
            call.on('stream', (remoteStream) => {
              const remoteAudio = document.getElementById("remoteAudio");
              remoteAudio.srcObject = remoteStream;
              remoteAudio.play();
            });
          });
        } catch(e) {}

        document.getElementById("loginScreen").classList.add("hidden");
        document.getElementById("lobbyScreen").classList.remove("hidden");
        document.getElementById("welcomeUser").innerText = "أهلاً بك، " + selectedAvatarEmoji + " " + name + " 👋";
      });
    }

    function createRoom() {
      const roomId = Math.floor(1000 + Math.random() * 9000).toString();
      currentRoomId = roomId;
      isUserAdmin = true;

      db.ref('rooms/' + roomId).set({
        host: currentUser.uid,
        players: { 
          [currentUser.uid]: { name: currentUser.name, avatar: currentUser.avatar } 
        }
      }).then(() => {
        enterRoomView(roomId);
      });
    }

    function searchAndJoinRoom() {
      const roomId = document.getElementById("roomCodeInput").value.trim();
      if (!roomId) return alert("اكتب كود الروم!");

      db.ref('rooms/' + roomId).once('value', (snapshot) => {
        if (snapshot.exists()) {
          currentRoomId = roomId;
          db.ref('rooms/' + roomId + '/players/' + currentUser.uid).set({
            name: currentUser.name,
            avatar: currentUser.avatar
          });

          snapshot.child('players').forEach((childSnapshot) => {
            const peerId = childSnapshot.key;
            if (peerId !== currentUser.uid) {
              connectToPeer(peerId);
            }
          });

          enterRoomView(roomId);
        } else {
          alert("الروم غير موجودة!");
        }
      });
    }

    function connectToPeer(otherPeerId) {
      if (!peer || !localStream) return;
      try {
        const call = peer.call(otherPeerId, localStream);
        if (call) {
          call.on('stream', (remoteStream) => {
            const remoteAudio = document.getElementById("remoteAudio");
            remoteAudio.srcObject = remoteStream;
            remoteAudio.play();
          });
        }
      } catch(e) {}
    }

    function enterRoomView(roomId) {
      document.getElementById("lobbyScreen").classList.add("hidden");
      document.getElementById("roomScreen").classList.remove("hidden");
      document.getElementById("roomTitle").innerText = "🚪 الغرفة: " + roomId;

      if (isUserAdmin) {
        document.getElementById("adminPanel").style.display = "block";
      }

      db.ref('rooms/' + roomId + '/players').on('value', (snapshot) => {
        const players = snapshot.val();
        if (!players) return;
        let names = [];
        const arena = document.getElementById("arenaBox");
        arena.innerHTML = '<div class="mic-icon">🎤</div>';

        let index = 0;
        for (let id in players) {
          const p = players[id];
          const pName = typeof p === 'object' ? p.name : p;
          const pAvatar = typeof p === 'object' ? p.avatar : '👤';
          
          names.push(pAvatar + " " + pName);

          const avatarEl = document.createElement("div");
          avatarEl.className = "avatar-player";
          avatarEl.style.top = (10 + (index * 26)) + "px";
          avatarEl.style.left = "15px"; 
          avatarEl.innerHTML = pAvatar + " " + pName;
          arena.appendChild(avatarEl);
          index++;

          if (id !== currentUser.uid) {
            connectToPeer(id);
          }
        }
        document.getElementById("playersList").innerText = "👥 المتصلون: " + names.join(" ، ");
      });

      db.ref('rooms/' + roomId + '/currentChallenge').on('value', (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        const allAvatars = document.querySelectorAll('.avatar-player');
        allAvatars.forEach(av => {
          av.style.left = "62%"; 
        });

        setTimeout(() => {
          const vPlayer = document.getElementById("videoPlayer");
          const aPlayer = document.getElementById("audioPlayer");
          document.getElementById("challengeText").innerText = "🎙️ وصلوا للمايك! استمع للتقليد الآن!";
          
          vPlayer.style.display = "none";
          aPlayer.style.display = "none";

          if (data.type === 'video') {
            vPlayer.src = data.url;
            vPlayer.style.display = "block";
            vPlayer.play();
          } else {
            aPlayer.src = data.url;
            aPlayer.style.display = "block";
            aPlayer.play();
          }
        }, 2000);
      });
    }

    async function uploadAndSend() {
      const fileInput = document.getElementById("fileInput");
      const file = fileInput.files[0];
      if (!file) return alert("اختر ملف صوت أو فيديو أولاً!");

      const storageRef = storage.ref('rooms/' + currentRoomId + '/' + Date.now() + '_' + file.name);
      await storageRef.put(file);
      const fileUrl = await storageRef.getDownloadURL();
      const type = file.type.startsWith('video') ? 'video' : 'audio';

      db.ref('rooms/' + currentRoomId + '/currentChallenge').set({
        url: fileUrl,
        type: type
      });
    }

    const wheelOptions = [
      "🔥 تخريب: قلد الصوت وأنت مغمض عيونك!",
      "⭐ بونس: نقاطك مضاعفة هذه الجولة (x2)!",
      "🤫 تخريب: ممنوع تستخدم أيديك نهائياً!",
      "🛡️ بونس: حماية كاملة من العقوبة!",
      "🤪 تخريب: قلد الصوت بصوت شخص معصب!",
      "💧 تخريب: قلد الصوت همساً (بدون إزعاج)!"
    ];

    function spinWheel() {
      const res = document.getElementById("wheelResult");
      let count = 0;
      const interval = setInterval(() => {
        res.innerText = wheelOptions[Math.floor(Math.random() * wheelOptions.length)];
        count++;
        if (count > 8) {
          clearInterval(interval);
          const final = wheelOptions[Math.floor(Math.random() * wheelOptions.length)];
          res.innerText = "🎯 النتيجة: " + final;
        }
      }, 100);
    }
  </script>
</body>
  </html>
